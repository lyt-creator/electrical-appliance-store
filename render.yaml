services:
  - type: web
    name: electrical-appliance-store
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node api/src/index.js
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
